name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Préparer les fichiers web
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon.svg www/

      - name: Installer Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Configurer Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "fr.mesheures.app",
            "appName": "MesHeures",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "allowMixedContent": false }
          }
          EOF

      - name: Générer le projet Android
        run: npx cap add android

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mesheures-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
